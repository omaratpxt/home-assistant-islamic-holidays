name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
      new_version: ${{ steps.tag.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version and create temporary tag
        id: tag
        uses: mathieudutour/github-tag-action@v7.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: v

      - name: Delete temporary tag (will be recreated after manifest update)
        run: |
          TAG="${{ steps.tag.outputs.new_tag }}"
          git push origin --delete "${TAG}" 2>/dev/null || true

  update-manifest-and-release:
    needs: determine-version
    runs-on: ubuntu-latest
    if: needs.determine-version.outputs.new_tag != ''
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          fetch-tags: true

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Update manifest.json
        run: |
          python3 << 'EOF'
          import json
          import os
          import sys

          manifest_path = "custom_components/islamic_holidays/manifest.json"
          version = os.environ.get("VERSION")

          if not version:
              print("Error: VERSION environment variable not set", file=sys.stderr)
              sys.exit(1)

          try:
              with open(manifest_path, encoding="utf-8") as f:
                  manifest = json.load(f)

              manifest["version"] = version

              with open(manifest_path, "w", encoding="utf-8") as f:
                  json.dump(manifest, f, indent=2)
                  f.write("\n")
              print(f"Updated manifest.json version to {version}")
          except OSError as e:
              print(f"Error updating manifest.json: {e}", file=sys.stderr)
              sys.exit(1)
          EOF
        env:
          VERSION: ${{ needs.determine-version.outputs.new_version }}

      - name: Validate JSON
        run: |
          python3 -m json.tool custom_components/islamic_holidays/manifest.json > /dev/null
          echo "✓ manifest.json is valid JSON"

      - name: Commit and push manifest.json update
        run: |
          git add custom_components/islamic_holidays/manifest.json
          git commit -m "chore: bump version to ${{ needs.determine-version.outputs.new_version }}" || exit 0
          git push

      - name: Create and push tag
        run: |
          TAG="${{ needs.determine-version.outputs.new_tag }}"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.determine-version.outputs.new_tag }}
          name: Release ${{ needs.determine-version.outputs.new_tag }}
          generate_release_notes: true
